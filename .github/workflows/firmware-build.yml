# ============================================================================
# BuildOS 固件编译工作流（workflow_dispatch，优化版）
# ----------------------------------------------------------------------------
# 由本地主程序触发，云端 runner 装依赖→clone 源码→写 .config/files→make。
# 产物以 Artifact=<buildCode> 上传，主程序轮询并用 PAT 拉回，经域名下发。
#
# 本版相对旧版的关键优化（把首次/二次编译从 ~100min 降到 ~55min，增量更快）：
#  1) ccache 无条件启用，按 分支+target 分桶缓存并跨 build 复用（旧版因
#     if: configB64=='' 而永不生效 → 每次冷编译）
#  2) CCACHE_DIR / CONFIG_CCACHE_DIR 显式对齐到 runner.temp/ccache
#     （OpenWrt rules.mk 会以 CONFIG_CCACHE_DIR 覆盖环境变量，必须写进 .config）
#  3) dl/(下载的包源码) 缓存复用，避免每次重新下载
#  4) tools/ 串行编译后，再 make -j 并行全量（避免 ccache 包装器竞态）
#  5) 支持 incremental=true 的增量精简：仅改配置/加包时，命中上一次 ccache 与 dl，
#     只重编受影响包，几分钟~二十分钟即可出新固件
#
# 前置：私有源码/私有 feed 需 secrets.REPO_WRITE_PAT(Contents:read)；
#       触发用 PAT 需 Actions:read/write + Workflows:read。
# 注意：仓库若开启 main 分支保护(禁止 force-push)，clean-history 会被拒，
#       需关闭分支保护或改由保留历史。
# ============================================================================
name: firmware-build

on:
  workflow_dispatch:
    inputs:
      buildCode:
        description: 构建标识
        required: true
      srcRepo:
        description: OpenWrt 源码仓库 git 地址
        required: false
        default: https://github.com/openwrt/openwrt.git
      srcRef:
        description: 源码分支或 Tag（gitBranch）
        required: false
        default: master
      deviceLabel:
        description: 设备标签
        required: false
        default: unknown
      target:
        description: target/subtarget
        required: false
        default: ""
      profile:
        description: profile
        required: false
        default: ""
      openwrtRelease:
        required: false
        default: ""
      plugins:
        required: false
        default: ""
      configOptions:
        required: false
        default: ""
      luciLanguage:
        required: false
        default: zh_Hans
      # 增量：true=基于上次成功构建只重编变更包；假=全量
      incremental:
        description: 增量构建
        required: false
        default: "false"
      configB64:
        description: .config 内容(base64)
        required: false
        default: ""
      filesB64:
        description: files/ tar.gz(base64)
        required: false
        default: ""
      # 离线加速：填 offline-prefetch 产出的 Release tag（如 offline-x86-64-v23-05-5），
      # 则用仓库里提前下载好的 dl/ 与 feeds/ 装配，跳过联网下载，大幅缩短编译时间。
      offlineRelease:
        description: 离线包 Release tag（offline-prefetch 生成）
        required: false
        default: ""
      # 增量半成品：把已编译的 build_dir/staging_dir（toolchain+host+已构建包）缓存到
      # 独立仓库（默认同仓库，可指定 semiRepo）的 Release（semi-<srcRef>-<target>-<subtarget>）。
      # 下次同分支仅在配置里加插件时，恢复半成品后 make 只重编新增包，几分钟~二十分钟即可出新固件。
      semiRepo:
        description: 半成品缓存仓库(owner/repo)，留空=本仓库。跨仓库需配 secret SEMI_GH_TOKEN(PAT 对半成品仓库有写权限)
        required: false
        default: ""
      semiRelease:
        description: 半成品缓存 Release tag（恢复用，需有对应资产，可空）
        required: false
        default: ""
      saveSemi:
        description: 构建成功后是否把半成品回传到 Release 缓存
        required: false
        default: "false"
      semiChunkMB:
        description: 半成品打包单卷上限(MB)，需 <2000
        required: false
        default: "1500"

concurrency:
  group: ${{ github.event.inputs.buildCode }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

env:
  OPENWRT_REPO: ${{ inputs.srcRepo }}
  OPENWRT_BRANCH: ${{ inputs.srcRef }}
  BUILD_DIR: buildos-src

jobs:
  build:
    runs-on: ubuntu-latest
    # 需要 contents: write 才能在构建成功后把镜像发布成本仓库的 GitHub Release
    permissions:
      contents: write
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update -y
          # Ubuntu 24.04 移除 python3-distutils；python3-setuptools 提供 import distutils 兼容
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache gawk gettext git python3 python3-setuptools \
            file subversion libncurses5-dev zlib1g-dev libssl-dev flex bison g++ bzip2 \
            unzip wget rsync libtool autoconf curl time perl
          echo deps-ok

      - name: 缓存 ccache（按 分支+target 分桶，跨配置可回退复用）
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ inputs.srcRef }}-${{ inputs.target }}
          restore-keys: |
            ccache-${{ inputs.srcRef }}-
            ccache-

      - name: 缓存 dl 包源码（按分支复用，免重复下载）
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dl
          key: dl-${{ inputs.srcRef }}
          restore-keys: |
            dl-

      # 离线加速：提供 offlineRelease 时，先装配仓库里预热好的离线包（dl/ + feeds/）。
      # 离线包解包到临时目录，dl 并入 runner.temp/dl（供下方 ln 与 build 复用），
      # feeds 并入 BUILD_DIR/feeds，使后续 feeds update/install 无需联网拉全源。
      - name: 装配离线包（可选，跳过联网下载）
        if: github.event.inputs.offlineRelease != ''
        shell: bash
        run: |
          mkdir -p "${{ runner.temp }}/dl" "$(dirname "$BUILD_DIR")/bundle"
          echo "== 下载离线包 Release ${{ inputs.offlineRelease }} =="
          gh release download "${{ inputs.offlineRelease }}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'offline-*.tar.gz' \
            --dir /tmp/offline --clobber 2>/dev/null || { echo "无离线资产，回退在线"; exit 0; }
          ls -la /tmp/offline/
          tar -xzpf /tmp/offline/offline-*.tar.gz -C "$(dirname "$BUILD_DIR")/bundle"
          echo "== 装配 dl =="
          if [ -d "$(dirname "$BUILD_DIR")/bundle/dl" ]; then
            cp -an "$(dirname "$BUILD_DIR")/bundle/dl/." "${{ runner.temp }}/dl/" || true
            echo "dl 已并入本地缓存，文件数: $(ls "${{ runner.temp }}/dl" | wc -l)"
          fi
          echo "OFFLINE_DIR=$(dirname "$BUILD_DIR")/bundle" >> "$GITHUB_ENV"

      # runner.temp 只在 step 上下文可用，故用 $GITHUB_ENV 固化为本 job 的 CCACHE_* 环境变量
      - name: 设置 ccache 环境
        run: |
          echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=4G" >> "$GITHUB_ENV"
          echo "config ccache env ok"

      - name: 克隆源码
        run: |
          git clone --depth=1 -b "$OPENWRT_BRANCH" "$OPENWRT_REPO" "$BUILD_DIR" 2>/dev/null || \
            git clone -b "$OPENWRT_BRANCH" "$OPENWRT_REPO" "$BUILD_DIR" 2>/dev/null || \
            git clone "$OPENWRT_REPO" "$BUILD_DIR"
          echo "== source $(git -C $BUILD_DIR rev-parse --short HEAD)"
          # dl/ 指到缓存目录：包源码与 ccache 一样跨构建持久，避免重复下载
          # 必须先建好 runner.temp/dl 再 ln，否则缓存未命中时 dl 是悬空链接，
          # OpenWrt 下载包时 mkdir -p dl 会因 dl 已存在而报 "File exists"（见 tools/xz）
          mkdir -p "${{ runner.temp }}/dl"
          ln -sfn "${{ runner.temp }}/dl" "$BUILD_DIR/dl" && echo "== dl -> runner.temp/dl"

      - name: 恢复增量半成品（可选，命中则加插件只需重编新增包）
        if: github.event.inputs.semiRelease != ''
        shell: bash
        env:
          # 跨仓库恢复需要对该仓库有 read 权限的 PAT；同仓库(留空)用默认 github.token 即可
          GH_TOKEN: ${{ secrets.SEMI_GH_TOKEN || github.token }}
        run: |
          set -e
          SEMI_REPO="${{ inputs.semiRepo }}"
          [ -z "$SEMI_REPO" ] && SEMI_REPO="$GITHUB_REPOSITORY"
          echo "== 下载半成品 Release ${{ inputs.semiRelease }} ($SEMI_REPO) 至 BUILD_DIR=$BUILD_DIR"
          mkdir -p /tmp/semi && rm -rf /tmp/semi/*
          gh release download "${{ inputs.semiRelease }}" \
            --repo "$SEMI_REPO" \
            --pattern 'semi-*.part*' \
            --dir /tmp/semi --clobber 2>/dev/null || { echo "!! 半成品无资产，回退全量编译"; exit 0; }
          ls -la /tmp/semi/
          # 按 partNN 序号拼接还原为单个 tar.gz
          cat "$(for f in /tmp/semi/semi-*.part*; do echo "$f"; done | sort -V)" > /tmp/semi/full.tar.gz
          ls -la /tmp/semi/full.tar.gz
          echo "== 解压半成品到 $BUILD_DIR（build_dir/staging_dir/.config 恢复）=="
          tar -xzpf /tmp/semi/full.tar.gz -C "$BUILD_DIR"
          echo "== 半成品恢复结果 =="
          du -sh "$BUILD_DIR"/staging_dir "$BUILD_DIR"/build_dir 2>/dev/null || echo "(无 staging/build 目录)"
          # 半成品里如果带旧 .config，删除以免覆盖用户新配置（用户配置会在下方重新生成）
          rm -f "$BUILD_DIR/.config" || true
          # 半成品里若带真实 dl/（非软链），删除之：该目录在克隆步骤已被软链到 runner.temp/dl，
          # 真实目录会破坏符号链接语义，导致后续下载不写入持久缓存。
          if [ -e "$BUILD_DIR/dl" ] && [ ! -L "$BUILD_DIR/dl" ]; then
            rm -rf "$BUILD_DIR/dl"
            ln -sfn "${{ runner.temp }}/dl" "$BUILD_DIR/dl"
            echo "== 已重置 dl 软链至 runner.temp/dl =="
          fi

      - name: 写入配置
        run: |
          cd "$BUILD_DIR"
          if [ -n "${{ inputs.configB64 }}" ]; then
            echo "${{ inputs.configB64 }}" | base64 -d > /tmp/user-config
            # 校验：必须是纯文本且含 CONFIG_ 行；否则丢弃，由 make defconfig 生成默认配置
            if LC_ALL=C grep -q $'\x00' /tmp/user-config 2>/dev/null; then
              echo "WARN: configB64 含二进制内容，已忽略"; rm -f /tmp/user-config
            elif grep -q "^CONFIG_" /tmp/user-config 2>/dev/null; then
              cp /tmp/user-config .config && echo "OK: 使用用户配置"
            else
              echo "WARN: configB64 无有效 CONFIG_ 行，已忽略"; rm -f /tmp/user-config
            fi
          fi
          if [ -n "${{ inputs.filesB64 }}" ]; then
            echo "${{ inputs.filesB64 }}" | base64 -d > /tmp/files.tgz
            mkdir -p files && tar -xzf /tmp/files.tgz -C files
          fi

      - name: feeds 更新
        shell: bash
        run: |
          cd "$BUILD_DIR"
          # 离线加速：若离线包含 feeds，先并入，让 feeds install 直接用已下载的源，不联网
          if [ -n "$OFFLINE_DIR" ] && [ -d "$OFFLINE_DIR/feeds" ]; then
            echo "== 使用离线 feeds =="
            cp -an "$OFFLINE_DIR/feeds/." feeds/ 2>/dev/null || true
            ./scripts/feeds install -a > /tmp/feeds-install.log 2>&1
            echo "== feeds install(offline) exit=$?"
            tail -15 /tmp/feeds-install.log
          else
            ./scripts/feeds update -a > /tmp/feeds.log 2>&1
            echo "== feeds update exit=$?"
            tail -20 /tmp/feeds.log
            ./scripts/feeds install -a > /tmp/feeds-install.log 2>&1
            echo "== feeds install exit=$?"
            tail -20 /tmp/feeds-install.log
          fi

      - name: 生成 config（含 prereq 检查，完整输出缺项）
        shell: bash
        run: |
          cd "$BUILD_DIR"
          # 启用 ccache。注意：OpenWrt rules.mk 会用 := 覆盖环境 CCACHE_DIR，仅采纳
          # CONFIG_CCACHE_DIR（默认 $(TOPDIR)/.ccache 会落到源码目录且无人缓存）。
          # 故必须在 .config 里显式指到 runner.temp/ccache 并预建目录，cache 才能命中。
          grep -q '^CONFIG_CCACHE=y' .config 2>/dev/null || echo 'CONFIG_CCACHE=y' >> .config
          mkdir -p "${{ runner.temp }}/ccache"
          grep -q '^CONFIG_CCACHE_DIR=' .config 2>/dev/null || \
            echo "CONFIG_CCACHE_DIR=\"${{ runner.temp }}/ccache\"" >> .config
          echo "== ccache 二进制: $(command -v ccache || echo MISSING)"
          echo "== ccache 缓存目录(经 CONFIG_CCACHE_DIR): ${{ runner.temp }}/ccache"
          # 正常跑 prereq 以便真实缺项输出到 log；失败时打印诊断
          if make defconfig > /tmp/defconfig.log 2>&1; then
            echo "== defconfig OK =="
            tail -30 /tmp/defconfig.log
          else
            echo "== defconfig FAILED =="
            tail -60 /tmp/defconfig.log
            exit 1
          fi

      - name: 编译
        run: |
          cd "$BUILD_DIR"
          # 先串行编译宿主工具链（含 ccache 包装器），否则 -j 下 xz/expat 等经 ccache
          # 编译会因包装器尚未生成而竞态失败（openwrt forum: tools/ccache/compile 先行即可）
          set +e
          make tools/compile > /tmp/make-tools.log 2>&1
          T=$?
          set -e
          echo "== tools/compile exit=$T =="
          tail -30 /tmp/make-tools.log
          if [ $T != 0 ]; then
            echo "== tools/compile 失败详情 =="
            grep -inE 'error:|ccache|fatal|no such|failed' /tmp/make-tools.log | tail -30 || true
            exit 1
          fi
          # 并行编译：全量 vs 增量（增量只重编受影响包，命中 ccache 则很快）
          if [ "${{ inputs.incremental }}" = "true" ]; then
            echo "== 增量编译（基于上一次 ccache/dl，仅重编差异）build start $(date) =="
          else
            echo "== 全量编译 build start $(date) =="
          fi
          set +e
          make -j$(nproc) > /tmp/make.log 2>&1
          M=$?
          set -e
          echo "== make exit=$M =="
          tail -50 /tmp/make.log
          if [ $M != 0 ]; then
            echo "== 失败详情（具体工具/包报错）=="
            grep -nE 'error:|Error [0-9]|failed to build|No rule|without' /tmp/make.log | tail -40
          fi
          test $M = 0

      - name: ccache 统计
        run: |
          echo "== ccache 统计（确认缓存已建立）=="
          CCACHE_DIR="${{ runner.temp }}/ccache" ccache -s 2>/dev/null || echo "(ccache -s 不可用)"
          du -sh "${{ runner.temp }}/ccache" 2>/dev/null || echo "(ccache 目录为空)"

      - name: 收集产物
        run: |
          mkdir -p out
          find "$BUILD_DIR/bin/targets" -type f \( -name "*.bin" -o -name "*.img.gz" -o -name "*.itb" -o -name "*sha256sums*" \) 2>/dev/null | while read f; do cp -f "$f" out/ 2>/dev/null || true; done
          echo "== out files:"; ls -la out 2>/dev/null || echo "no out"

      # 直接把镜像发布成本仓库的 GitHub Release（tag=buildos-<buildCode>）。
      # 反向代理交付：本地零存储，/api/download 直接用 token 代理这些 asset 的下载流。
      # 与 Actions artifact 相比更持久，且无需服务端落盘回传。
      - name: 发布构建产物到 Release
        if: success() && github.event.inputs.buildCode != ''
        shell: bash
        run: |
          cd out
          TAG="buildos-${{ inputs.buildCode }}"
          set +e
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "== release $TAG 已存在（幂等跳过） =="
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" ./* --clobber
          else
            echo "== 创建 release $TAG =="
            gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" \
              --title "BuildOS ${{ inputs.buildCode }}" \
              --notes "device=${{ inputs.deviceLabel }}, target=${{ inputs.target }}/${{ inputs.profile }}, release=${{ inputs.openwrtRelease }}" \
              --prerelease
          fi
          echo "== release assets =="
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' || true

      # 回传增量半成品：把构建中间产物打包并切分卷（≤2GB/asset）发布到半成品仓库的
      # semi-<...> Release。供下一轮同分支仅加插件的增量构建恢复，实现"加插件几分钟出新固件"。
      - name: 回传增量半成品（可选）
        if: success() && github.event.inputs.saveSemi == 'true'
        shell: bash
        env:
          # 跨仓库回传需要对该仓库有写权限的 PAT；同仓库(留空)用默认 github.token 即可
          GH_TOKEN: ${{ secrets.SEMI_GH_TOKEN || github.token }}
        run: |
          set -e
          SEMI_REPO="${{ inputs.semiRepo }}"
          [ -z "$SEMI_REPO" ] && SEMI_REPO="$GITHUB_REPOSITORY"
          SEMI_TAG="semi-${{ inputs.srcRef }}-${{ inputs.target }}"
          CHUNK_MB="${{ inputs.semiChunkMB }}"
          [ -z "$CHUNK_MB" ] && CHUNK_MB=1500
          echo "== 打包半成品 -> $SEMI_REPO/$SEMI_TAG (chunk=${CHUNK_MB}MB) =="
          du -sh "$BUILD_DIR"/staging_dir "$BUILD_DIR"/build_dir 2>/dev/null || { echo "!! 无半成品目录可回传"; exit 0; }
          mkdir -p /tmp/semiout && rm -rf /tmp/semiout/*
          # 只保留关键中间产物：staging_dir(含 toolchain+host+已构建包) + build_dir(各包编译目录)
          # + dl(已下载源码，极大加速下次)，不打包源码/feeds/out。
          tar -czf /tmp/semiout/semi.tar.gz \
            -C "$BUILD_DIR" \
            staging_dir build_dir dl .config 2>/dev/null || true
          ls -la /tmp/semiout/semi.tar.gz
          # 切分卷：重命名为 semi-<n>.part（n 从 0 起）。gh release upload 单个 asset 需 <2GB。
          cd /tmp/semiout
          split -b "${CHUNK_MB}m" -d -a 3 --additional-suffix=.part semi.tar.gz semi-
          ls -la /tmp/semiout/
          # 幂等发布到半成品仓库
          if gh release view "$SEMI_TAG" --repo "$SEMI_REPO" >/dev/null 2>&1; then
            echo "== release $SEMI_TAG 存在：删除旧资产后重传 =="
            gh release delete "$SEMI_TAG" --repo "$SEMI_REPO" --yes --cleanup-tag 2>/dev/null || true
          fi
          gh release create "$SEMI_TAG" \
            --repo "$SEMI_REPO" /tmp/semiout/semi-*.part \
            --title "BuildOS 半成品 ${{ inputs.target }}" \
            --notes "incremental: srcRef=${{ inputs.srcRef }}, target=${{ inputs.target }}. 供增量构建复用 build_dir/staging_dir." \
            --prerelease 2>&1 | tail -5
          echo "== 半成品已回传 $SEMI_REPO/$SEMI_TAG =="

      # 兜底 artifact（部分旧流程仍读取该路径；新交付优先走 Release）
      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.buildCode }}
          path: out/
          if-no-files-found: warn
          retention-days: 3

  # 成功构建后清空历史：孤儿提交重建 main 并强推（保留 workflow 本身）。
  # 若仓库开启 main 分支保护(禁止 force-push)，此 job 会失败；可直接删除此 job 来保留历史。
  clean-history:
    needs: build
    if: success() && github.event.inputs.buildCode != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: 重写为孤儿提交并强推
        shell: bash
        run: |
          set -e
          git config user.name "buildos-cleaner"
          git config user.email "cleaner@localhost"
          git checkout --orphan fresh$$
          git add -A
          git commit -m "fresh"
          git branch -M main
          git push -f origin main