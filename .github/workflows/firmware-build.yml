# ============================================================
# BuildOS 编译农场（公开测试版）
#   云端 OpenWrt 编译，产物以 Artifact 回传。仅需本样本仓库。
# ============================================================
name: firmware-build

on:
  workflow_dispatch:
    inputs:
      buildCode:
        description: 构建标识
        required: true
      srcRepo:
        description: OpenWrt 源码仓库
        required: false
        default: https://github.com/openwrt/openwrt.git
      srcRef:
        description: 分支或 Tag
        required: false
        default: master
      deviceLabel:
        required: false
        default: unknown
      target:
        required: false
        default: ""
      profile:
        required: false
        default: ""
      openwrtRelease:
        required: false
        default: ""
      plugins:
        required: false
        default: ""
      configOptions:
        required: false
        default: ""
      luciLanguage:
        required: false
        default: zh_Hans
      configB64:
        description: .config 内容(base64)
        required: false
        default: ""
      filesB64:
        description: files/ tar.gz(base64)
        required: false
        default: ""

concurrency:
  group: ${{ github.event.inputs.buildCode }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  OPENWRT_REPO: ${{ inputs.srcRepo }}
  OPENWRT_BRANCH: ${{ inputs.srcRef }}
  BUILD_DIR: buildos-src

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update -y
          # Ubuntu 24.04 移除 python3-distutils；python3-setuptools 提供 import distutils 兼容
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache gawk gettext git python3 python3-setuptools \
            file subversion libncurses5-dev zlib1g-dev libssl-dev flex bison g++ bzip2 \
            unzip wget rsync libtool autoconf curl time perl
          echo deps-ok

      - name: 缓存 ccache（按 分支+target 分桶，跨配置可回退复用）
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ inputs.srcRef }}-${{ inputs.target }}
          restore-keys: |
            ccache-${{ inputs.srcRef }}-
            ccache-

      - name: 缓存 dl 包源码（按分支复用，免重复下载）
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dl
          key: dl-${{ inputs.srcRef }}
          restore-keys: |
            dl-

      # runner.temp 只在 step 上下文可用，故用 $GITHUB_ENV 把它固化为本 job 的 CCACHE_* 环境变量
      - name: 设置 ccache 环境
        run: |
          echo "CCACHE_DIR=${{ runner.temp }}/ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=4G" >> "$GITHUB_ENV"
          echo "config ccache env ok"

      - name: 克隆源码
        run: |
          git clone --depth=1 -b "$OPENWRT_BRANCH" "$OPENWRT_REPO" "$BUILD_DIR" 2>/dev/null || \
            git clone "$OPENWRT_REPO" "$BUILD_DIR"
          echo "== source $(git -C $BUILD_DIR rev-parse --short HEAD)"
          # dl/ 指到缓存目录：包源码与 ccache 一样跨构建持久，避免重复下载
          # 必须先建好 runner.temp/dl 再 ln，否则缓存未命中时 dl 是悬空链接，
          # OpenWrt 下载包时 mkdir -p dl 会因 dl 已存在而报 "File exists"（见 tools/xz）
          mkdir -p "${{ runner.temp }}/dl"
          ln -sfn "${{ runner.temp }}/dl" "$BUILD_DIR/dl" && echo "== dl -> runner.temp/dl"

      - name: 写入配置
        run: |
          cd "$BUILD_DIR"
          if [ -n "${{ inputs.configB64 }}" ]; then
            echo "${{ inputs.configB64 }}" | base64 -d > /tmp/user-config
            # 校验：必须是纯文本且含 CONFIG_ 行；否则丢弃，由 make defconfig 生成默认配置
            if LC_ALL=C grep -q $'\x00' /tmp/user-config 2>/dev/null; then
              echo "WARN: configB64 含二进制内容，已忽略"; rm -f /tmp/user-config
            elif grep -q "^CONFIG_" /tmp/user-config 2>/dev/null; then
              cp /tmp/user-config .config && echo "OK: 使用用户配置"
            else
              echo "WARN: configB64 无有效 CONFIG_ 行，已忽略"; rm -f /tmp/user-config
            fi
          fi
          if [ -n "${{ inputs.filesB64 }}" ]; then
            echo "${{ inputs.filesB64 }}" | base64 -d > /tmp/files.tgz
            mkdir -p files && tar -xzf /tmp/files.tgz -C files
          fi

      - name: feeds 更新
        shell: bash
        run: |
          cd "$BUILD_DIR"
          ./scripts/feeds update -a > /tmp/feeds.log 2>&1
          echo "== feeds update exit=$?"
          tail -20 /tmp/feeds.log
          ./scripts/feeds install -a > /tmp/feeds-install.log 2>&1
          echo "== feeds install exit=$?"
          tail -20 /tmp/feeds-install.log

      - name: 生成 config（含 prereq 检查，完整输出缺项）
        shell: bash
        run: |
          cd "$BUILD_DIR"
          # 启用 ccache。注意：OpenWrt rules.mk 会用 := 覆盖环境 CCACHE_DIR，仅采纳
          # CONFIG_CCACHE_DIR（默认 $(TOPDIR)/.ccache 会落到源码目录且无人缓存）。
          # 故必须在 .config 里显式指到 runner.temp/ccache 并预建目录，cache 才能命中。
          grep -q '^CONFIG_CCACHE=y' .config 2>/dev/null || echo 'CONFIG_CCACHE=y' >> .config
          mkdir -p "${{ runner.temp }}/ccache"
          grep -q '^CONFIG_CCACHE_DIR=' .config 2>/dev/null || \
            echo "CONFIG_CCACHE_DIR=\"${{ runner.temp }}/ccache\"" >> .config
          echo "== ccache 二进制: $(command -v ccache || echo MISSING)"
          echo "== ccache 缓存目录(经 CONFIG_CCACHE_DIR): ${{ runner.temp }}/ccache"
          # 正常跑 prereq 以便真实缺项输出到 log；失败时打印诊断
          if make defconfig > /tmp/defconfig.log 2>&1; then
            echo "== defconfig OK =="
            tail -30 /tmp/defconfig.log
          else
            echo "== defconfig FAILED =="
            echo "--- .prereq-error (/tmp) ---"
            cat /tmp/.prereq-error 2>/dev/null || echo "(无)"
            echo "--- staging_dir/host 下记录文件 ---"
            for f in "$BUILD_DIR/staging_dir/host/.missing" "$BUILD_DIR/staging_dir/host/.prereq-error" "$BUILD_DIR/staging_dir/host/.prereq-build"; do
              echo "[$f]"; cat "$f" 2>/dev/null || echo "(无)"
            done
            echo "--- staging_dir/host/bin 已建链接 ---"
            ls -la "$BUILD_DIR/staging_dir/host/bin" 2>/dev/null | head -40 || echo "(无 staging bin)"
            echo "--- defconfig log tail ---"
            tail -40 /tmp/defconfig.log
            exit 1
          fi

      - name: 编译
        run: |
          cd "$BUILD_DIR"
          # 先串行编译宿主工具链（含 ccache 包装器），否则 -j 下 xz/expat 等经 ccache
          # 编译会因包装器尚未生成而竞态失败（openwrt forum: tools/ccache/compile 先行即可）
          # 用 set +e 抓退出码，避免 bash -e 吞掉错误输出
          set +e
          make tools/compile > /tmp/make-tools.log 2>&1
          T=$?
          set -e
          echo "== tools/compile exit=$T =="
          tail -30 /tmp/make-tools.log
          echo "== tools 关键错误 =="
          grep -inE 'error|ccache|fatal|no such|failed' /tmp/make-tools.log | tail -20 || true
          if [ $T != 0 ]; then
            echo "== 重跑失败工具拿真实 verbose 错误 =="
            for name in $(grep -oE 'ERROR: tools/[A-Za-z0-9.+-]+ failed' /tmp/make-tools.log | sed -E 's#.*tools/([A-Za-z0-9.+-]+) failed#\1#' | sort -u); do
              echo "---- tools/$name V=s (from TOPDIR) ----"
              make "tools/$name/compile" V=s 2>&1 | tail -120 || true
            done
            exit 1
          fi
          # 并行编译全量
          set +e
          make -j$(nproc) > /tmp/make.log 2>&1
          M=$?
          set -e
          echo "== make exit=$M =="
          tail -50 /tmp/make.log
          if [ $M != 0 ]; then
            echo "== 失败详情（具体工具/包报错）=="
            grep -nE 'error:|Error [0-9]|failed to build|No rule|without' /tmp/make.log | tail -40
          fi
          test $M = 0

      - name: ccache 统计
        run: |
          echo "== ccache 统计（写入确认缓存已建立）=="
          CCACHE_DIR="${{ runner.temp }}/ccache" ccache -s 2>/dev/null || echo "(ccache -s 不可用)"
          echo "== ccache 目录大小 =="
          du -sh "${{ runner.temp }}/ccache" 2>/dev/null || echo "(ccache 目录为空/不存在)"

      - name: 收集产物
        run: |
          mkdir -p out
          find "$BUILD_DIR/bin" -type f \( -name "*.bin" -o -name "*.img.gz" -o -name "*.tar.gz" -o -name "*.itb" -o -name "*sha256sums*" \) 2>/dev/null | while read f; do cp -f "$f" "out/" 2>/dev/null || true; done
          ls out || echo "no out"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.buildCode }}
          path: out/
          if-no-files-found: warn
          retention-days: 3

  # 成功构建后清空历史（孤儿提交强推，保留仓库文件）
  clean-history:
    needs: build
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 重写为孤儿提交并强推
        shell: bash
        run: |
          set -e
          git config user.name "buildos-cleaner"
          git config user.email "cleaner@localhost"
          # 用孤立提交重建历史，原文件（含 workflow/.gitignore）保留在当前提交
          git checkout --orphan fresh$$
          git add -A
          git commit -m "fresh"
          git branch -M main
          git push -f origin main